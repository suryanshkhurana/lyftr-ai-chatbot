name: lyftr-ai

services:
  backend:
    build:
      context: ./backend
    image: lyftr-ai-backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-flash-lite-latest}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are Lyftr AI, a helpful, concise assistant. Answer clearly and accurately.}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional self-hosted last-resort fallback (disabled unless model, base and key are all set).
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL:-}
      FALLBACK_LLM_API_BASE: ${FALLBACK_LLM_API_BASE:-}
      FALLBACK_LLM_API_KEY: ${FALLBACK_LLM_API_KEY:-}
      FALLBACK_LLM_TIMEOUT_SECONDS: ${FALLBACK_LLM_TIMEOUT_SECONDS:-120}
    volumes:
      - lyftr_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser on your machine calls the backend, so this is the host URL (not "backend").
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: lyftr-ai-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lyftr_data:
